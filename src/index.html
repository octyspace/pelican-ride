<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f0" />
    <meta name="description" content="一只系着红领巾的鹈鹕，骑着单车穿过海边小路。拖动视角，听一听海浪。" />
    <title>海岸骑行 · 漫游放映室</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='9' fill='%23265349'/%3E%3Cpath d='M6 21q6-2 7-11 3-6 7 0l7 3-8 1q-1 9-13 7' fill='%23fff4d9'/%3E%3C/svg%3E"
    />
    <style>
      /*__STYLE__*/
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
      <symbol id="i-soundoff" viewBox="0 0 24 24">
        <path d="M11 4 6.5 8H3.8v8h2.7L11 20zM16 9l5 6m0-6-5 6" />
      </symbol>
      <symbol id="i-soundon" viewBox="0 0 24 24">
        <path d="M11 4 6.5 8H3.8v8h2.7L11 20zM15 8a5 5 0 0 1 0 8m3-11a9 9 0 0 1 0 14" />
      </symbol>
      <symbol id="i-camera" viewBox="0 0 24 24">
        <path d="M3 7.5h4l1.5-3h7l1.5 3h4v12H3z" />
        <circle cx="12" cy="13" r="3.2" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          stroke="none"
          d="M7 4.8c0-.85.9-1.34 1.6-.88l11.1 7.14a1.08 1.08 0 0 1 0 1.85L8.6 20.08a1 1 0 0 1-1.6-.88z"
        />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect fill="currentColor" stroke="none" x="5.5" y="4.4" width="4.3" height="15.2" rx="1.1" />
        <rect fill="currentColor" stroke="none" x="14.2" y="4.4" width="4.3" height="15.2" rx="1.1" />
      </symbol>
      <symbol id="i-view" viewBox="0 0 24 24">
        <path d="m12 2 8 4.5v10L12 21l-8-4.5v-10zM4 6.5l8 4.5 8-4.5M12 11v10" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" /></symbol>
      <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4m16 0h-5V4m0 16v-5h5M4 15h5v5" /></symbol>
      <symbol id="i-speed" viewBox="0 0 24 24">
        <path d="M3.4 17a9 9 0 1 1 17.2 0H3.4zM12 13l4-5" />
        <circle fill="currentColor" cx="12" cy="13" r="1" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9 5.5 5.5L17.5 9" /></symbol>
      <symbol id="i-mouse" viewBox="0 0 24 24">
        <rect x="6" y="2.5" width="12" height="19" rx="6" />
        <path d="M12 6v4" />
      </symbol>
      <symbol id="i-touch" viewBox="0 0 24 24">
        <path d="M8 13V6a2 2 0 0 1 4 0v5l2-1 3 1 3 1v4.5q0 5-6 5h-2q-2 0-4-2.5l-4-5q-1-3 2-2z" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" /></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 10a8 8 0 1 1 1.5 8M4 4v6h6" /></symbol>
    </svg>
    <main class="shell">
      <header class="mast">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="1" y="1" width="46" height="46" rx="14" fill="#234f45" />
            <path
              d="M6.6 30.7c5.6 1.1 10.3-.7 12.4-5.3 1.5-3.3 1.8-6.8 3.7-10.4 1.5-2.9 4-4.4 6.5-3.5 1.7.6 2.5 1.9 2.8 3.2l-3.8 4.1c.2 7.6-3.2 13.7-9.8 15.5-4.8 1.2-8.9.1-11.8-3.6Z"
              fill="#fff7df"
            />
            <path
              d="M29.7 15.2c1.5-.5 2.7-.2 4.1.3l8.4 3.3c.5.2.4.7-.1.9-4.8 1.4-10.2 1.2-13.5-.8l-1.2-1.5z"
              fill="#f2a04e"
            />
            <circle cx="28.3" cy="14.7" r="1.05" fill="#264a42" />
            <path
              d="M12.2 29.8q6.4.5 9.8-5.2"
              fill="none"
              stroke="#9cab8d"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
          <span class="brand-name">漫游放映室</span>
        </div>
        <div class="mast-actions">
          <button id="sound" class="text-action" type="button" aria-pressed="false">
            <svg><use href="#i-soundoff" /></svg><span>环境音<span id="sound-state">关</span></span></button
          ><span class="mast-divider"></span
          ><button id="snap" class="photo-action" type="button">
            <svg><use href="#i-camera" /></svg><span>拍张照片</span>
          </button>
        </div>
      </header>
      <section class="theater" id="theater" aria-label="鹈鹕海岸骑行三维场景">
        <div class="stage" id="stage">
          <div class="sky" aria-hidden="true"></div>
          <canvas
            id="scene"
            aria-label="鹈鹕骑着绿色自行车沿海岸前行。拖动旋转视角，滚轮或双指缩放。"
            tabindex="0"
          ></canvas>
          <div class="title-block">
            <div class="eyebrow">
              <span class="rule"></span> PELICAN RIDES <span class="edition">/ &nbsp; VOL. 01</span>
            </div>
            <h1>海岸骑行</h1>
            <p>一只鹈鹕的单车漫游</p>
          </div>
          <button class="scene-tool" id="expand" aria-label="全屏观看" title="全屏观看">
            <svg><use href="#i-expand" /></svg>
          </button>
          <div id="load" class="loading" role="status">正在打开海岸场景…</div>
          <div class="hud">
            <span class="live"><span class="live-dot"></span>实时 3D</span
            ><span class="gesture"
              ><svg><use href="#i-mouse" /></svg><span class="desktop-hint">拖动旋转 <b>·</b> 滚轮缩放</span
              ><span class="touch-hint">拖动旋转 <b>·</b> 双指缩放</span></span
            >
          </div>
        </div>
        <div class="controlbar" aria-label="骑行控制">
          <div class="transport">
            <button id="play" class="play" title="暂停骑行（空格）" aria-label="暂停骑行">
              <svg><use href="#i-pause" /></svg>
            </button>
            <div>
              <span class="small-label">播放控制</span
              ><strong id="playing-state" aria-live="polite">正在骑行</strong>
            </div>
          </div>
          <div class="speed-block">
            <span class="control-label"
              ><svg><use href="#i-speed" /></svg>骑行速度</span
            >
            <div class="speeds" role="group" aria-label="骑行速度">
              <button data-speed=".5" aria-pressed="false">0.5×</button
              ><button data-speed="1" aria-pressed="true">1×</button
              ><button data-speed="1.5" aria-pressed="false">1.5×</button
              ><button data-speed="2" aria-pressed="false">2×</button>
            </div>
          </div>
          <div class="view-block">
            <label for="view" class="control-label"
              ><svg><use href="#i-view" /></svg>镜头视角</label
            >
            <div class="select-wrap">
              <select id="view">
                <option value="side">侧面跟拍</option>
                <option value="front">前侧跟拍</option>
                <option value="wide">海岸全景</option>
                <option value="free" hidden>自由视角</option></select
              ><svg><use href="#i-down" /></svg>
            </div>
            <button id="reset" class="reset" aria-label="恢复默认镜头" title="恢复默认镜头">
              <svg><use href="#i-reset" /></svg>
            </button>
          </div>
        </div>
      </section>
      <div class="toast" id="toast" role="status"></div>
    </main>
    <script>
      /*__SCRIPT__*/
    </script>
  </body>
</html>
