<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f0" />
    <meta name="description" content="一只系着红领巾的鹈鹕，骑着单车穿过海边小路。拖动视角，听一听海浪。" />
    <title>海岸骑行 · 漫游放映室</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='9' fill='%23265349'/%3E%3Cpath d='M6 21q6-2 7-11 3-6 7 0l7 3-8 1q-1 9-13 7' fill='%23fff4d9'/%3E%3C/svg%3E"
    />
    <style>
      :root {
  color-scheme: light;
  --ink: #233f36;
  --soft: #65756c;
  --pine: #245447;
  --line: #dcdfd4;
  --paper: #faf9f2;
  --sans: Inter, 'Noto Sans SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
body {
  background: linear-gradient(120deg, #fcfaf3, #f6f6ed);
}
button,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button,
select {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
select:focus-visible,
canvas:focus-visible {
  outline: 3px solid #cf783a;
  outline-offset: 3px;
}
button {
  transition:
    background 0.18s,
    color 0.18s,
    transform 0.18s;
}
button:active {
  transform: scale(0.965);
}
.symbols {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
svg:not(.brand-mark) {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linejoin: round;
  stroke-linecap: round;
  flex-shrink: 0;
}
.shell {
  width: min(1700px, 100%);
  margin: 0 auto;
  padding: 0 clamp(16px, 3.2vw, 60px) clamp(22px, 3vw, 48px);
}
.mast {
  height: clamp(74px, 9vh, 98px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.brand,
.mast-actions,
.text-action,
.photo-action,
.transport,
.speed-block,
.view-block,
.control-label,
.live,
.gesture,
.eyebrow {
  display: flex;
  align-items: center;
}
.brand {
  gap: 12px;
}
.brand-mark {
  width: 39px;
  height: 39px;
  flex: none;
}
.brand-name {
  font-size: clamp(18px, 1.55vw, 24px);
  font-weight: 800;
  letter-spacing: 0.08em;
}
.mast-actions {
  gap: 20px;
}
.text-action,
.photo-action {
  gap: 8px;
  font-size: 13px;
  font-weight: 550;
  border: 0;
  justify-content: center;
}
.text-action {
  background: transparent;
  padding: 10px 0;
  color: #536258;
}
.text-action:hover {
  color: #143d31;
}
.text-action[aria-pressed='true'] {
  color: #1d6249;
}
#sound-state {
  margin-left: 4px;
}
.mast-divider {
  width: 1px;
  height: 17px;
  background: #d8dbcf;
}
.photo-action {
  background: #eeefe5;
  border: 1px solid #dce0d2;
  padding: 9px 15px;
  border-radius: 50px;
}
.photo-action:hover,
.reset:hover,
.select-wrap:hover {
  background: #e4e9dc;
}
.theater {
  position: relative;
}
.stage {
  height: clamp(440px, calc(100svh - 216px), 860px);
  border-radius: 22px;
  isolation: isolate;
  position: relative;
  overflow: hidden;
  background: #b3ddd8;
  outline: 1px solid rgba(44, 78, 50, 0.08);
  outline-offset: -1px;
}
.sky {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(to bottom, #9dcfda 0%, #bedfe1 25%, #e8edda 54%, #e8ead1 100%);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
canvas.dragging {
  cursor: grabbing;
}
.title-block {
  position: absolute;
  top: clamp(23px, 4.1vw, 67px);
  left: clamp(22px, 3.8vw, 68px);
  pointer-events: none;
  color: #244b40;
}
.eyebrow {
  gap: 10px;
  font-family: Inter, 'Arial', sans-serif;
  font-size: clamp(9px, 0.75vw, 12px);
  line-height: 1.4;
  font-weight: 750;
  letter-spacing: 0.16em;
}
.rule {
  width: 23px;
  height: 2px;
  background: #cb7248;
  display: inline-block;
}
.edition {
  opacity: 0.76;
  font-size: 0.92em;
  letter-spacing: 0.12em;
}
h1 {
  font-family: 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', 'STSong', serif;
  font-weight: 900;
  font-size: clamp(42px, 4.3vw, 76px);
  line-height: 1.22;
  letter-spacing: 0.025em;
  margin: 12px 0 8px;
}
.title-block p {
  margin: 0;
  font-size: clamp(12px, 1.04vw, 17px);
  letter-spacing: 0.14em;
  color: #405f53;
  font-weight: 500;
}
.scene-tool {
  width: 38px;
  height: 38px;
  position: absolute;
  top: 22px;
  right: 22px;
  display: grid;
  place-items: center;
  color: #35564c;
  background: #fbfbefbc;
  border: 1px solid #fff8;
  border-radius: 50%;
  backdrop-filter: blur(8px);
}
.scene-tool:hover {
  background: #fffff1;
}
.scene-tool svg {
  width: 17px;
  height: 17px;
}
.hud {
  position: absolute;
  pointer-events: none;
  left: 22px;
  right: 22px;
  bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #34473a;
}
.live,
.gesture {
  background: rgba(252, 249, 232, 0.84);
  backdrop-filter: blur(8px);
  border: 1px solid #fffff354;
  border-radius: 24px;
  font-size: 11px;
  font-weight: 600;
  gap: 7px;
  letter-spacing: 0.045em;
  padding: 7px 12px;
}
.live {
  font-family: var(--sans);
  font-variant-numeric: tabular-nums;
}
.live-dot {
  background: #54835c;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.gesture svg {
  width: 14px;
  height: 14px;
}
.gesture {
  font-weight: 500;
  letter-spacing: 0.025em;
}
.gesture b {
  padding: 0 5px;
  font-weight: 500;
}
.touch-hint {
  display: none;
}
.controlbar {
  background: #fffef8;
  border: 1px solid #dedfd3;
  border-radius: 18px;
  margin-top: 16px;
  display: grid;
  grid-template-columns: minmax(150px, 0.85fr) minmax(280px, 1.45fr) minmax(270px, 1.1fr);
  align-items: center;
  padding: clamp(15px, 1.5vw, 24px) clamp(19px, 2.3vw, 38px);
  gap: clamp(16px, 2.7vw, 52px);
  box-shadow: 0 4px 16px #344b2706;
}
.transport {
  gap: 14px;
}
.play {
  width: 49px;
  height: 49px;
  flex: none;
  border: 0;
  color: #fffdee;
  background: var(--pine);
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: inset 0 0 0 1px #143c3325;
}
.play:hover {
  background: #326a56;
}
.play svg {
  width: 21px;
  height: 21px;
}
.small-label {
  display: block;
  color: #717a6d;
  font-size: 11px;
  letter-spacing: 0.08em;
  margin-bottom: 3px;
}
.transport strong {
  display: block;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 650;
  letter-spacing: 0.03em;
}
.speed-block,
.view-block {
  gap: clamp(10px, 1.2vw, 24px);
  border-left: 1px solid var(--line);
  padding-left: clamp(16px, 2.5vw, 46px);
  min-height: 40px;
}
.control-label {
  font-size: 13px;
  letter-spacing: 0.025em;
  gap: 8px;
  font-weight: 600;
  white-space: nowrap;
}
.control-label svg {
  width: 17px;
  height: 17px;
  color: #677769;
}
.speeds {
  display: flex;
  gap: 2px;
  background: #f0f1e8;
  border-radius: 11px;
  padding: 4px;
  flex: 1;
  max-width: 236px;
}
.speeds button {
  flex: 1;
  min-width: 38px;
  border: 0;
  padding: 7px 5px;
  border-radius: 7px;
  background: transparent;
  font-size: 13px;
  color: #59675b;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  font-family: Inter, Arial, sans-serif;
  font-weight: 600;
}
.speeds button:hover {
  background: #e2e6d9;
}
.speeds button[aria-pressed='true'] {
  background: #d9e4d4;
  color: #244d3f;
  box-shadow: 0 1px 3px #344a2c16;
}
.view-block {
  justify-content: space-between;
  gap: 10px;
}
.select-wrap {
  position: relative;
  flex: 1;
  max-width: 190px;
  min-width: 106px;
  border: 1px solid #dfe2d5;
  border-radius: 10px;
  background: #f8f9f1;
}
.select-wrap select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 9px 26px 9px 12px;
  font-size: 13px;
  line-height: 1.55;
  border-radius: 10px;
}
.select-wrap svg {
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  pointer-events: none;
}
.reset {
  background: none;
  border: 0;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #5c6c60;
}
.reset svg {
  width: 17px;
  height: 17px;
}
.loading,
.toast {
  position: absolute;
  padding: 10px 16px;
  border-radius: 24px;
  background: #254d43;
  color: #fffdee;
  font-size: 13px;
  text-align: center;
}
.loading {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.loading[hidden] {
  display: none;
}
.toast {
  position: fixed;
  z-index: 10;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 12px);
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  box-shadow: 0 4px 18px #254d4322;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.theater:fullscreen,
.theater.expanded {
  background: var(--paper);
  padding: 12px;
  display: flex;
  flex-direction: column;
  overflow: auto;
}
.theater.expanded {
  position: fixed;
  inset: 0;
  z-index: 5;
}
.theater:fullscreen .stage,
.theater.expanded .stage {
  flex: 1;
  height: auto;
  min-height: 0;
}
.theater:fullscreen .controlbar,
.theater.expanded .controlbar {
  flex-shrink: 0;
  margin-top: 10px;
}
@media (max-width: 1100px) {
  .controlbar {
    grid-template-columns: 0.8fr 1.3fr 1.1fr;
    gap: 14px;
    padding: 16px 20px;
  }
  .speed-block,
  .view-block {
    padding-left: 16px;
  }
  .control-label {
    gap: 5px;
  }
  .control-label svg {
    display: none;
  }
  .mast-actions {
    gap: 15px;
  }
}
@media (max-width: 820px) {
  .controlbar {
    grid-template-columns: 1fr 1.2fr;
    gap: 14px;
  }
  .transport {
    grid-column: 1;
    grid-row: 1;
  }
  .speed-block {
    grid-column: 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }
  .speeds {
    width: 100%;
    flex: none;
  }
  .view-block {
    grid-row: 2;
    grid-column: 1;
    padding-left: 0;
    border: 0;
    justify-content: flex-start;
  }
  .select-wrap {
    max-width: 125px;
  }
  .stage {
    height: clamp(410px, calc(100svh - 280px), 850px);
  }
}
@media (max-width: 600px) {
  .shell {
    padding: 0 12px 18px;
  }
  .mast {
    height: 66px;
  }
  .brand {
    gap: 8px;
  }
  .brand-mark {
    width: 33px;
    height: 33px;
  }
  .brand-name {
    font-size: 17px;
  }
  .mast-actions {
    gap: 10px;
  }
  .mast-divider {
    display: none;
  }
  .text-action,
  .photo-action {
    font-size: 11px;
    gap: 5px;
  }
  .text-action svg,
  .photo-action svg {
    width: 16px;
    height: 16px;
  }
  .photo-action {
    padding: 7px 10px;
  }
  .stage {
    height: clamp(400px, 62svh, 620px);
    border-radius: 16px;
  }
  .title-block {
    top: 22px;
    left: 20px;
  }
  .eyebrow {
    font-size: 8px;
    gap: 7px;
  }
  .rule {
    width: 17px;
  }
  h1 {
    font-size: 37px;
    margin: 7px 0 3px;
  }
  .title-block p {
    font-size: 11px;
  }
  .scene-tool {
    right: 14px;
    top: 14px;
    width: 32px;
    height: 32px;
  }
  .hud {
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
  .live,
  .gesture {
    font-size: 9px;
    padding: 5px 8px;
    gap: 5px;
  }
  .desktop-hint {
    display: none;
  }
  .touch-hint {
    display: inline;
  }
  .controlbar {
    border-radius: 15px;
    margin-top: 10px;
    padding: 13px 12px;
    gap: 10px 8px;
    grid-template-columns: 1fr auto;
  }
  .transport {
    gap: 9px;
  }
  .play {
    width: 36px;
    height: 36px;
  }
  .play svg {
    width: 17px;
    height: 17px;
  }
  .small-label {
    font-size: 9px;
    margin-bottom: 0;
  }
  .transport strong {
    font-size: 14px;
  }
  .speed-block {
    grid-row: 1;
    grid-column: 2;
    border: 0;
    padding: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }
  .speed-block .control-label {
    font-size: 0;
  }
  .speed-block .control-label svg {
    display: block;
    width: 15px;
    height: 15px;
  }
  .speeds {
    width: auto;
    gap: 0;
    padding: 3px;
  }
  .speeds button {
    min-width: 32px;
    font-size: 11px;
    padding: 6px 4px;
  }
  .view-block {
    grid-column: 1 / -1;
    grid-row: 2;
    border-top: 1px solid var(--line);
    padding-top: 10px;
    gap: 8px;
  }
  .view-block .control-label {
    margin-right: auto;
    font-size: 12px;
  }
  .view-block .control-label svg {
    display: block;
  }
  .select-wrap {
    flex: 0 0 106px;
  }
  .select-wrap select {
    font-size: 12px;
    padding-top: 6px;
    padding-bottom: 6px;
  }
  .reset {
    height: 30px;
    width: 30px;
  }
}
@media (pointer: coarse) {
  .touch-hint {
    display: inline;
  }
  .desktop-hint {
    display: none;
  }
}
@media (max-height: 540px) and (orientation: landscape) {
  .mast {
    height: 50px;
  }
  .stage {
    height: calc(100svh - 68px);
    min-height: 255px;
  }
  .title-block {
    top: 16px;
    left: 25px;
  }
  h1 {
    font-size: 36px;
  }
  .title-block p {
    font-size: 11px;
  }
  .controlbar {
    margin-top: 8px;
  }
  .theater:fullscreen .controlbar,
  .theater.expanded .controlbar {
    padding: 6px 14px;
    display: flex;
    justify-content: space-around;
  }
  .theater:fullscreen .view-block,
  .theater.expanded .view-block {
    border: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

    </style>
  </head>
  <body>

    <main class="shell">
      <header class="mast">
        <div class="brand">

            <path

            <path

        <div class="mast-actions">
          <button id="sound" class="text-action" type="button" aria-pressed="false">
